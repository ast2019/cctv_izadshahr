# Portal nginx — HTTP mode (IP / port 8888)
# One portal login (HttpOnly cookie portal_session) gates every Frigate UI.
# Frigate is reached on internal port 5000 so it never shows its own login.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    include /usr/share/nginx/html/nginx-portal-locations.inc;
}
