# center22 = پارکینگ. Record-only NVR.
# .89 و .90 عمداً حذف شده‌اند چون کار نمی‌کردند؛ انبار نیز در نمونه anbar است.
mqtt:
  enabled: false

auth:
  cookie_secure: false
  session_length: 2592000
  refresh_time: 1296000

detect:
  enabled: false
  fps: 3

record:
  enabled: true
  retain:
    days: 1
    mode: all

snapshots:
  enabled: false

birdseye:
  enabled: false

ffmpeg:
  global_args: -hide_banner -loglevel warning
  output_args:
    record: preset-record-generic

go2rtc:
  streams:
    # DVR پارکینگ۴؛ کانال ۵ در نمونه anbar است.
    # dvr_parking4_ch1, ch2, ch3 منتقل شدند به anbar.
    dvr_parking4_ch4:
      - rtsp://192.168.51.222:554/user=admin_password=admin123_channel=4_stream=0.sdp?real_stream
    # دوربین‌های پارکینگ (password admin123)
    # cam_2, cam_42, cam_45, cam_46 منتقل شدند به mahoote (محوطه).
    cam_8:
      - rtsp://admin:admin123@192.168.51.8:554/Streaming/Channels/102
    cam_82:
      - rtsp://admin:admin123@192.168.51.82:554/Streaming/Channels/102
    cam_83:
      - rtsp://admin:admin123@192.168.51.83:554/Streaming/Channels/102
    cam_86:
      - rtsp://admin:admin123@192.168.51.86:554/Streaming/Channels/102
    cam_91:
      - rtsp://admin:admin123@192.168.51.91:554/Streaming/Channels/102
    cam_92:
      - rtsp://admin:admin123@192.168.51.92:554/Streaming/Channels/102
    cam_93:
      - rtsp://admin:admin123@192.168.51.93:554/Streaming/Channels/102
    cam_94:
      - rtsp://admin:admin123@192.168.51.94:554/Streaming/Channels/102
    # cam_98 منتقل شد به نمونه khanedari.

cameras:
  # dvr_parking4_ch1, ch2, ch3 منتقل شدند به anbar.
  dvr_parking4_ch4:
    ffmpeg: { inputs: [{ path: rtsp://127.0.0.1:8554/dvr_parking4_ch4, input_args: preset-rtsp-restream, roles: [record] }] }
  # cam_2, cam_42, cam_45, cam_46 منتقل شدند به mahoote (محوطه).
  cam_8:
    ffmpeg: { inputs: [{ path: rtsp://127.0.0.1:8554/cam_8, input_args: preset-rtsp-restream, roles: [record] }] }
  cam_82:
    ffmpeg: { inputs: [{ path: rtsp://127.0.0.1:8554/cam_82, input_args: preset-rtsp-restream, roles: [record] }] }
  cam_83:
    ffmpeg: { inputs: [{ path: rtsp://127.0.0.1:8554/cam_83, input_args: preset-rtsp-restream, roles: [record] }] }
  cam_86:
    ffmpeg: { inputs: [{ path: rtsp://127.0.0.1:8554/cam_86, input_args: preset-rtsp-restream, roles: [record] }] }
  cam_91:
    ffmpeg: { inputs: [{ path: rtsp://127.0.0.1:8554/cam_91, input_args: preset-rtsp-restream, roles: [record] }] }
  cam_92:
    ffmpeg: { inputs: [{ path: rtsp://127.0.0.1:8554/cam_92, input_args: preset-rtsp-restream, roles: [record] }] }
  cam_93:
    ffmpeg: { inputs: [{ path: rtsp://127.0.0.1:8554/cam_93, input_args: preset-rtsp-restream, roles: [record] }] }
  cam_94:
    ffmpeg: { inputs: [{ path: rtsp://127.0.0.1:8554/cam_94, input_args: preset-rtsp-restream, roles: [record] }] }
  # cam_98 منتقل شد به نمونه khanedari.

version: 0.16-0
