# tasisat = تاسیسات. DISABLED — در انتظار نصب ۱۲ دوربین جدید پارکینگ ۱.
# cam_61, cam_62, cam_63, cam_65 به mahoote (محوطه) منتقل شدند.
# cam_64 بدون تصویر — فعلاً اینجا باقی می‌ماند.
# پس از نصب دوربین‌های جدید، این نمونه مجدداً فعال می‌شود.
mqtt:
  enabled: false

auth:
  cookie_secure: false
  session_length: 2592000
  refresh_time: 1296000

detect:
  enabled: false
  fps: 3

record:
  enabled: false

snapshots:
  enabled: false

birdseye:
  enabled: false

ffmpeg:
  global_args: -hide_banner -loglevel warning
  retry_interval: 120
  output_args:
    record: preset-record-generic

go2rtc:
  streams:
    # cam_61, cam_62, cam_63, cam_65 منتقل شدند به mahoote (محوطه).
    cam_64:
      - rtsp://admin:admin123@192.168.51.64:554/Streaming/Channels/102

cameras:
  cam_64:
    ffmpeg: { inputs: [{ path: rtsp://127.0.0.1:8554/cam_64, input_args: preset-rtsp-restream, roles: [record] }] }

version: 0.16-0
