# =============================================================================
# TEMPORARY instance — دوربین‌های باقی‌مانده غیرفعال‌اند (کاربر: disable).
# cam_96 → center22 (پارکینگ). cam_71 → mahoote (محوطه).
# غیرفعال: cam_21, cam_88, cam_89, cam_90, cam_72 (decode/record خاموش).
# بعد از تعیین تکلیف این دوربین‌ها، کل نمونه temp حذف می‌شود.
# =============================================================================
mqtt:
  enabled: false

auth:
  cookie_secure: false
  session_length: 2592000
  refresh_time: 1296000

detect:
  enabled: false
  fps: 3

record:
  enabled: false

snapshots:
  enabled: false

birdseye:
  enabled: false

ffmpeg:
  global_args: -hide_banner -loglevel warning
  retry_interval: 120
  output_args:
    record: preset-record-generic

# هیچ استریم فعالی نیست — دوربین‌های باقی‌مانده enabled: false تا بار CPU نیاورند.
go2rtc:
  streams: {}

cameras:
  cam_21:
    enabled: false
    ffmpeg: { inputs: [{ path: rtsp://admin:admin123@192.168.51.21:554/Streaming/Channels/102, roles: [record] }] }
  cam_88:
    enabled: false
    ffmpeg: { inputs: [{ path: rtsp://admin:admin123@192.168.51.88:554/Streaming/Channels/102, roles: [record] }] }
  cam_89:
    enabled: false
    ffmpeg: { inputs: [{ path: rtsp://admin:admin123@192.168.51.89:554/Streaming/Channels/102, roles: [record] }] }
  cam_90:
    enabled: false
    ffmpeg: { inputs: [{ path: rtsp://admin:admin123@192.168.51.90:554/Streaming/Channels/102, roles: [record] }] }
  cam_72:
    enabled: false
    ffmpeg: { inputs: [{ path: rtsp://admin:1259110%40av@192.168.51.72:554/Streaming/Channels/102, roles: [record] }] }

version: 0.16-0
